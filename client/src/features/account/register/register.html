<div class="card bg-base-100 w-1/2 mx-auto flex flex-col p-6 rounded-lg shadow-lg">
  <div class="card-title justify-center text-3xl text-primary">Sign up</div>
  <div class="card-body">
    <form #registerForm="ngForm" class="flex flex-col gap-4 w-full" (ngSubmit)="register()">
      <input type="email" class="input w-full" name="email" placeholder="Email" required [(ngModel)]="credentials.email" />
      <input type="text" class="input w-full" name="displayName" placeholder="Username" required [(ngModel)]="credentials.displayName" />
      <input type="password" class="input w-full" name="password" placeholder="Password" required [(ngModel)]="credentials.password" />
      <div class="flex flex-wrap items-center justify-end">
        <button (click)="cancel()" class="btn">Cancel</button>
        <button type="submit" class="btn btn-primary">Submit</button>
      </div>
    </form>
  </div>
</div>
